services:
  web:
    build: .
    image: ruxi-studio:local
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
    ports:
      - "127.0.0.1:${PORT:-8080}:8000"
    volumes:
      - studio_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"]
      interval: 20s
      timeout: 6s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
  worker:
    image: ruxi-studio:local
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
    command: ["python", "-m", "server.worker"]
    volumes:
      - studio_data:/data
    depends_on:
      web:
        condition: service_healthy
    stop_grace_period: 5m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
volumes:
  studio_data:
